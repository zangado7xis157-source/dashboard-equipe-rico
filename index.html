<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Rico CPA • Central Oficial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}.intro{position:fixed;inset:0;display:grid;place-items:center;background:#000}.box{width:min(470px,calc(100% - 48px));text-align:center;transform:translateY(-2vh)}.phase{opacity:0;transform:translateY(6px);transition:.38s ease}.phase.show{opacity:1;transform:none}.phase.hide{opacity:0;transform:translateY(-5px)}.starting{font:800 13px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:5px;color:#f4f4f4}.access{display:none}.line{height:1px;width:100%;margin:0 0 18px;background:linear-gradient(90deg,transparent,#ff304c 28%,#ff304c 72%,transparent);transform:scaleX(0);opacity:0;transition:.6s ease}.line.show{transform:scaleX(1);opacity:1}.title{font:800 13px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:5px;color:#f4f4f4}.title b{color:#ff304c}.protocol{margin-top:18px;font:700 9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:4px;color:#30343b}.pulse{position:absolute;inset:auto 0 9vh;text-align:center;font:600 8px/1 ui-monospace,Consolas,monospace;letter-spacing:3px;color:#171a20;animation:pulse 1s ease infinite alternate}@keyframes pulse{to{color:#383d46}}.fade{animation:fade .55s ease forwards}@keyframes fade{to{opacity:0}}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="box">
    <div class="phase starting" id="starting">INICIANDO OPERAÇÃO...</div>
    <div class="access" id="access">
      <div class="line" id="line"></div>
      <div class="phase title" id="title"><b>R</b> ACESSO LIBERADO</div>
      <div class="phase protocol" id="protocol">PROTOCOLO // 001</div>
    </div>
  </div>
  <div class="pulse">RICO CPA // EQUIPE RICO</div>
</div>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{
  const starting=document.getElementById('starting'),access=document.getElementById('access'),line=document.getElementById('line'),title=document.getElementById('title'),protocol=document.getElementById('protocol'),intro=document.getElementById('intro');
  starting.classList.add('show');
  await sleep(850);
  starting.classList.add('hide');
  await sleep(340);
  starting.style.display='none';access.style.display='block';
  requestAnimationFrame(()=>line.classList.add('show'));
  await sleep(250);title.classList.add('show');
  await sleep(330);protocol.classList.add('show');
  const pagePromise=fetch('/app.html?v=20261031-3',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao carregar central');return r.text()}).then(html=>html.replace(/R\$ 129,99/g,'R$ 119,99').replace(/R\$ 199,99/g,'R$ 119,99'));
  await sleep(1050);
  intro.classList.add('fade');
  await sleep(450);
  try{const html=await pagePromise;document.open();document.write(html);document.close()}catch(e){intro.classList.remove('fade');intro.innerHTML='<div class="box"><div class="title"><b>R</b> CENTRAL TEMPORARIAMENTE INDISPONÍVEL</div><div class="protocol">TENTE NOVAMENTE</div></div>'}
})();
</script>
</body>
</html>
