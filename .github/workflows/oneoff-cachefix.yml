name: Fix lifetime key button

on:
  push:
    paths:
      - .github/workflows/oneoff-cachefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix script injection position
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          old = "text=text.replace('</script>',GAMES_KEY_HANDLER+'\\n</script>');"
          new = "const scriptEnd=text.lastIndexOf('</script>');\n    if(scriptEnd!==-1)text=text.slice(0,scriptEnd)+GAMES_KEY_HANDLER+'\\n'+text.slice(scriptEnd);"
          if old not in s:
              raise SystemExit('injection line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix lifetime key button"
          git push
