name: One-off cache fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-cachefix.yml'

permissions:
  contents: write

jobs:
  publish-alternate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create fresh dashboard URL and cache hints
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta charset="UTF-8">'
          cache = '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n<meta http-equiv="Pragma" content="no-cache">\n<meta http-equiv="Expires" content="0">'
          if 'http-equiv="Cache-Control"' not in s:
              s = s.replace(marker, marker+'\n'+cache, 1)
              p.write_text(s, encoding='utf-8')
          Path('dashboard-atualizado.html').write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard-atualizado.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add fresh dashboard URL and no-cache hints'
          git push
