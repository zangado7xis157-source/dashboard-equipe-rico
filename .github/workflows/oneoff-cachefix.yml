name: One-off achievement peak

on:
  push:
    paths:
      - '.github/workflows/oneoff-cachefix.yml'

permissions:
  contents: write

jobs:
  update-achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep conquest progress from going down
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = '''function totalAchievementProfit(){
  const sorted=[...entries].sort((a,b)=>{
    const da=String(a.entry_date||"")+" "+String(a.created_at||"");
    const db=String(b.entry_date||"")+" "+String(b.created_at||"");
    return da.localeCompare(db);
  });
  let current=0,peak=0;
  sorted.forEach(e=>{
    const v=Number(e.value||0);
    if(e.entry_type==="deposito"||e.entry_type==="deposito_mae")current-=v;
    if(e.entry_type==="saque"||e.entry_type==="bau")current+=v;
    if(current>peak)peak=current;
  });
  return Math.max(0,peak);
}
function renderAchievements(){'''

          pattern = r'function totalAchievementProfit\(\)\{.*?\n\}\nfunction renderAchievements\(\)\{'
          changed = False
          for name in ('index.html','dashboard-atualizado.html'):
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              ns,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if count!=1:
                  raise SystemExit(f'achievement function not found in {name}')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed=True
          if not changed:
              raise SystemExit('no files changed')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html dashboard-atualizado.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep conquest progress from decreasing'
          git push
