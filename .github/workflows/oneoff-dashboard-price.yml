name: One-off dashboard price update

on:
  push:
    paths:
      - '.github/workflows/oneoff-dashboard-price.yml'

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard price and payment link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('59,90', '29,99')
          s = s.replace('59,99', '29,99')
          s = s.replace('59.90', '29.99')
          s = s.replace('https://nubank.com.br/cobrar/fvuvf2/6ac183ff-3511-4769-83bc-6fdd681350f8', 'https://nubank.com.br/cobrar/fvuvf2/6ac2ed65-d57b-4b82-97f5-ee2baac469e4')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update dashboard monthly price to R$ 29,99'
          git push
