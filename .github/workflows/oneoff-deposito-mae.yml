name: One-off deposito conta mae update

on:
  push:
    paths:
      - '.github/workflows/oneoff-deposito-mae.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add deposito conta mae option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.money{grid-template-columns:repeat(3,1fr)}', '.money{grid-template-columns:repeat(4,1fr)}', 1)
          old = '<div class="box"><h3 style="color:var(--yellow)">Depósito</h3><input id="depValue" placeholder="R$ 0,00"><button class="secondary" id="addDep">Adicionar</button></div>\n        <div class="box"><h3 style="color:var(--blue)">Saque</h3><input id="saqValue" placeholder="R$ 0,00"><button class="secondary" id="addSaq">Adicionar</button></div>'
          new = '<div class="box"><h3 style="color:var(--yellow)">Depósito</h3><input id="depValue" placeholder="R$ 0,00"><button class="secondary" id="addDep">Adicionar</button></div>\n        <div class="box"><h3 style="color:var(--green)">Depósito Conta Mãe</h3><input id="maeDepValue" placeholder="R$ 0,00"><button class="secondary" id="addMaeDep">Adicionar</button></div>\n        <div class="box"><h3 style="color:var(--blue)">Saque</h3><input id="saqValue" placeholder="R$ 0,00"><button class="secondary" id="addSaq">Adicionar</button></div>'
          if old not in s: raise SystemExit('money cards anchor not found')
          s = s.replace(old, new, 1)
          old = 'if(e.entry_type==="deposito")a.d+=v;\n    if(e.entry_type==="saque")a.s+=v;'
          new = 'if(e.entry_type==="deposito"||e.entry_type==="deposito_mae")a.d+=v;\n    if(e.entry_type==="saque")a.s+=v;'
          if old not in s: raise SystemExit('totals anchor not found')
          s = s.replace(old, new, 1)
          old = '$("addDep").onclick=()=>addEntry("deposito","depValue");\n$("addSaq").onclick=()=>addEntry("saque","saqValue");'
          new = '$("addDep").onclick=()=>addEntry("deposito","depValue");\n$("addMaeDep").onclick=()=>addEntry("deposito_mae","maeDepValue");\n$("addSaq").onclick=()=>addEntry("saque","saqValue");'
          if old not in s: raise SystemExit('handlers anchor not found')
          s = s.replace(old, new, 1)
          old = 'const deposits=list.filter(e=>e.entry_type==="deposito");'
          new = 'const deposits=list.filter(e=>e.entry_type==="deposito"||e.entry_type==="deposito_mae");'
          if old not in s: raise SystemExit('history deposits anchor not found')
          s = s.replace(old, new, 1)
          old = 'if(e.entry_type==="deposito")byDay[day-1]-=v;'
          new = 'if(e.entry_type==="deposito"||e.entry_type==="deposito_mae")byDay[day-1]-=v;'
          if old not in s: raise SystemExit('month chart anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Deposito Conta Mae option to dashboard'
          git push
