name: One-off dashboard layout fit
on:
  push:
    paths:
      - '.github/workflows/oneoff-layout-fit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar layout do dashboard
        run: |
          if ! grep -q 'RICO_LAYOUT_FIT_20261006' rico-operations-v2.css; then
            echo '' | base64 -d >> rico-operations-v2.css
          fi
          rm -f .github/workflows/oneoff-layout-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fit operations panel inside dashboard layout"
          git push
