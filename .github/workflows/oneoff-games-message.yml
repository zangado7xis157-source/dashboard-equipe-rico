name: One-off games message visibility update

on:
  push:
    paths:
      - '.github/workflows/oneoff-games-message.yml'

permissions:
  contents: write

jobs:
  update-games-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make locked games message visible immediately
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''  $("gamesView").classList.remove("hidden");\n  $("dashboardTab").className="secondary";'''
          new='''  $("gamesView").classList.remove("hidden");\n  window.scrollTo({top:0,left:0,behavior:"auto"});\n  requestAnimationFrame(()=>{\n    const overlay=$("gamesLockedOverlay");\n    if(overlay && !overlay.classList.contains("hidden")){\n      overlay.scrollIntoView({behavior:"auto",block:"center"});\n    }\n  });\n  $("dashboardTab").className="secondary";'''
          if old not in s:
              raise SystemExit('Target snippet not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show rollover lock message immediately on open'
          git push
