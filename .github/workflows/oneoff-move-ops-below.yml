name: One-off move operations below dashboard
"on":
  push:
    paths:
      - '.github/workflows/oneoff-move-ops-below.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move operations panel below dashboard grid
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('rico-operations-v2.js')
          s = js.read_text(encoding='utf-8')
          marker = 'RICO_OPS_PLACEMENT_FIX_20261006'
          if marker not in s:
              s += r'''

/* RICO_OPS_PLACEMENT_FIX_20261006 */
(()=>{
  function placeRicoOperations(){
    const grid=document.querySelector('.dashboard-view.layout')||document.querySelector('.dashboard-view');
    if(!grid||!grid.parentNode)return;
    const tabs=document.getElementById('ricoCycleTabsBar');
    const ops=document.getElementById('ricoOpsV2');
    if(tabs){
      if(tabs.previousElementSibling!==grid) grid.insertAdjacentElement('afterend',tabs);
      if(ops&&ops.previousElementSibling!==tabs) tabs.insertAdjacentElement('afterend',ops);
    }else if(ops&&ops.previousElementSibling!==grid){
      grid.insertAdjacentElement('afterend',ops);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(placeRicoOperations,120));
  else setTimeout(placeRicoOperations,120);
  setTimeout(placeRicoOperations,500);
  setTimeout(placeRicoOperations,1200);
  setInterval(placeRicoOperations,1800);
})();
'''
              js.write_text(s,encoding='utf-8')

          css = Path('rico-operations-v2.css')
          c = css.read_text(encoding='utf-8')
          marker2 = '/* RICO_OPS_BELOW_GRID_20261006 */'
          if marker2 not in c:
              c += r'''

/* RICO_OPS_BELOW_GRID_20261006 */
html,body{max-width:100%;overflow-x:hidden}
body.rico-ops-v2-ready .dashboard-view.layout{overflow:visible!important}
body.rico-ops-v2-ready #ricoCycleTabsBar,
body.rico-ops-v2-ready #ricoOpsV2{
  grid-column:1/-1!important;
  position:relative!important;
  left:auto!important;
  right:auto!important;
  transform:none!important;
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
}
body.rico-ops-v2-ready #ricoCycleTabsBar{margin:16px 0 0!important}
body.rico-ops-v2-ready #ricoOpsV2{margin:0 0 20px!important}
body.rico-ops-v2-ready .rico-ops-table-wrap{max-width:100%!important;overflow-x:auto!important;overflow-y:hidden!important}
body.rico-ops-v2-ready .rico-ops-table{width:100%!important;min-width:760px!important}
@media(max-width:780px){
  body.rico-ops-v2-ready #ricoCycleTabsBar{margin-top:12px!important}
  body.rico-ops-v2-ready .rico-ops-table{min-width:680px!important}
}
'''
              css.write_text(c,encoding='utf-8')
          PY
          rm -f .github/workflows/oneoff-move-ops-below.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move operations panel below dashboard controls"
          git push
