name: One-off operations v2
on:
  push:
    paths:
      - '.github/workflows/oneoff-operations-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject operations assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="/rico-operations-v2.css?v=20261006">'
          js='<script src="/rico-operations-v2.js?v=20261006"></script>'
          if 'rico-operations-v2.css' not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if 'rico-operations-v2.js' not in s:
              pos=s.rfind('</body>')
              if pos < 0: raise SystemExit('no </body>')
              s=s[:pos]+js+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-off workflow
        run: rm -f .github/workflows/oneoff-operations-v2.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/oneoff-operations-v2.yml
          git commit -m "Enable operations v2 dashboard UI"
          git push origin main
