name: Install daily goal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install daily goal and push icon
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="/daily-goal-v1.js?v=20261025"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '\n</body>', 1)
              p.write_text(html, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          old = 'self.registration.showNotification(d.title||"Equipe Rico",{body:d.body||"",data:{url:d.url||"/"},tag:d.tag||undefined})'
          new = 'self.registration.showNotification(d.title||"Equipe Rico",{body:d.body||"",icon:d.icon||"/pwa-icon.svg",badge:d.badge||"/pwa-icon.svg",data:{url:d.url||"/"},tag:d.tag||undefined})'
          if old in text and new not in text:
              sw.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "feat: ativar meta diária e ícone push"
          git push
