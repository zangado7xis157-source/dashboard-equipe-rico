<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Contador Equipe Rico</title>
<style>
:root{--bg:#03070d;--panel:#07111f;--card:#0a1726;--line:#12395f;--blue:#168cff;--blue2:#5bb8ff;--text:#f5f9ff;--muted:#8da3b9;--red:#ff5365;--green:#42df8f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0a1c31,#03070d 62%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}.wrap{width:min(1120px,94vw);margin:0 auto;padding:22px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand small{display:block;color:var(--blue2);font-weight:900;letter-spacing:.16em}.brand h1{margin:3px 0 0;font-size:clamp(30px,5vw,52px);line-height:1}.actions{display:flex;gap:10px;flex-wrap:wrap}.action{border:1px solid #245989;background:#0c1c2d;color:#eaf5ff;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.action.primary{background:linear-gradient(135deg,#0b6fd1,#1795ff);border-color:#4eb4ff}.panel{background:linear-gradient(180deg,#07111f,#050d18);border:1px solid #143b63;border-radius:20px;padding:16px;box-shadow:0 25px 70px #0008}.rows{display:grid;gap:11px}.row{display:grid;grid-template-columns:78px 1fr 44px;gap:12px;align-items:center;background:#091725;border:1px solid #14508d;border-radius:15px;padding:12px}.profile{font-size:27px;font-weight:950;color:#299eff;text-align:center}.controls{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr)) minmax(110px,1.35fr) repeat(4,minmax(64px,1fr));gap:8px;align-items:center}.step{height:46px;border-radius:10px;font-size:16px;font-weight:950;cursor:pointer}.minus{background:#29131a;color:#ff6676;border:1px solid #7b2a38}.plus{background:#0d2d20;color:#56e59b;border:1px solid #24754d}.value{height:48px;display:grid;place-items:center;background:#02070c;border:1px solid #214d7a;border-radius:10px;font-size:27px;font-weight:950;letter-spacing:.02em}.delete{height:44px;border-radius:10px;background:#111d2b;color:#b6cee6;border:1px solid #2d4d6d;cursor:pointer}.add{width:100%;margin-top:14px;border:1px dashed #2c9cff;background:#071728;color:#4badff;border-radius:13px;min-height:50px;font-size:17px;font-weight:950;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.sum{background:#09131f;border:1px solid #173653;border-radius:14px;padding:16px}.sum span{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.sum strong{font-size:27px}.install-note{margin:14px 2px 0;color:var(--muted);font-size:13px;line-height:1.5}.status{color:#63e3a1;font-weight:800}
@media(max-width:900px){.row{grid-template-columns:52px 1fr 44px}.controls{grid-template-columns:repeat(4,1fr)}.value{grid-column:1/-1;grid-row:2}.summary{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.action{flex:1}.row{grid-template-columns:1fr}.profile{text-align:left}.delete{width:100%}.summary{grid-template-columns:1fr 1fr}.controls{grid-template-columns:repeat(2,1fr)}.value{grid-column:1/-1;grid-row:auto}.step{height:48px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><small>EQUIPE RICO</small><h1>Contador</h1></div>
    <div class="actions"><button class="action primary" id="installBtn" hidden>Instalar app</button><button class="action" id="resetBtn">Zerar todos</button></div>
  </header>
  <section class="panel">
    <div class="rows" id="rows" aria-live="polite"></div>
    <button class="add" id="addBtn">＋ Adicionar perfil</button>
    <div class="summary">
      <div class="sum"><span>Total de perfis</span><strong id="count">0</strong></div>
      <div class="sum"><span>Soma total</span><strong id="total">0</strong></div>
      <div class="sum"><span>Maior valor</span><strong id="max">0</strong></div>
      <div class="sum"><span>Menor valor</span><strong id="min">0</strong></div>
    </div>
    <p class="install-note"><span class="status">● Salvamento automático</span> — todos os valores ficam salvos neste aparelho. Os perfis começam em 0 e cada clique soma ou diminui automaticamente.</p>
  </section>
</main>
<script>
const KEY='contador-equipe-rico-v2';
const steps=[-500,-100,-10,-1,1,10,100,500];
let values;
try{const saved=JSON.parse(localStorage.getItem(KEY));values=Array.isArray(saved)&&saved.length?saved.map(v=>Number.isFinite(Number(v))?Number(v):0):[0,0,0,0]}catch{values=[0,0,0,0]}
const rows=document.getElementById('rows');
const save=()=>localStorage.setItem(KEY,JSON.stringify(values));
function render(){
 rows.innerHTML='';
 values.forEach((val,i)=>{
   const row=document.createElement('div');row.className='row';
   const p=document.createElement('div');p.className='profile';p.textContent='P'+(i+1);row.appendChild(p);
   const controls=document.createElement('div');controls.className='controls';
   steps.slice(0,4).forEach(step=>controls.appendChild(makeBtn(step,i)));
   const value=document.createElement('div');value.className='value';value.textContent=String(val);controls.appendChild(value);
   steps.slice(4).forEach(step=>controls.appendChild(makeBtn(step,i)));
   row.appendChild(controls);
   const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='✕';del.title='Excluir perfil';del.addEventListener('click',()=>{if(values.length>1){values.splice(i,1);save();render()}});row.appendChild(del);
   rows.appendChild(row);
 });
 const total=values.reduce((a,b)=>a+b,0);document.getElementById('count').textContent=values.length;document.getElementById('total').textContent=total;document.getElementById('max').textContent=Math.max(...values);document.getElementById('min').textContent=Math.min(...values);
}
function makeBtn(step,i){const b=document.createElement('button');b.type='button';b.className='step '+(step<0?'minus':'plus');b.textContent=step>0?'+'+step:String(step);b.addEventListener('click',()=>{values[i]+=step;save();render()});return b}
document.getElementById('addBtn').addEventListener('click',()=>{if(values.length<50){values.push(0);save();render()}});
document.getElementById('resetBtn').addEventListener('click',()=>{values=values.map(()=>0);save();render()});
let deferredPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});window.addEventListener('appinstalled',()=>{installBtn.hidden=true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
